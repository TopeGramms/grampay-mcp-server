<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="82%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#18C46C" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#18C46C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#0E1C16"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- Left column -->
  <g transform="translate(80, 92)">
    <!-- Brand -->
    <g>
      <rect x="0" y="0" width="40" height="40" rx="9" fill="#16281F"/>
      <path d="M11 8h18v25l-2.9-2-3 2-3-2-3 2-3.1-2z" fill="#EDE7D6"/>
      <path d="M16 15h9M16 19.5h9M16 24h5.4" stroke="#18C46C" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="29" font-size="30" font-weight="800" letter-spacing="-1" fill="#EDE7D6"><tspan fill="#18C46C">Gram</tspan>Pay</text>
    </g>

    <!-- Eyebrow -->
    <text x="2" y="104" font-family="'Courier New', monospace" font-size="19" letter-spacing="3" fill="#93A79A">MCP CONNECTOR · CRYPTO → NAIRA</text>

    <!-- Headline -->
    <text x="0" y="176" font-size="66" font-weight="800" letter-spacing="-2.5" fill="#F1EBDB">Tell your AI</text>
    <text x="0" y="248" font-size="66" font-weight="800" letter-spacing="-2.5" fill="#F1EBDB">to cash out.</text>

    <!-- Sub -->
    <text x="2" y="312" font-size="27" fill="#B9C6BC">It settles to a Nigerian bank account —</text>
    <text x="2" y="348" font-size="27" fill="#B9C6BC">from inside the conversation.</text>

    <!-- Chips -->
    <g font-family="'Courier New', monospace" font-size="17" fill="#8FB6A0">
      <g transform="translate(0, 402)">
        <rect x="0" y="0" width="182" height="38" rx="19" fill="none" stroke="#294036"/>
        <circle cx="22" cy="19" r="4" fill="#18C46C"/>
        <text x="36" y="25">signed tokens</text>
      </g>
      <g transform="translate(198, 402)">
        <rect x="0" y="0" width="168" height="38" rx="19" fill="none" stroke="#294036"/>
        <circle cx="22" cy="19" r="4" fill="#E6BB63"/>
        <text x="36" y="25">$1,000 cap</text>
      </g>
      <g transform="translate(384, 402)">
        <rect x="0" y="0" width="176" height="38" rx="19" fill="none" stroke="#294036"/>
        <circle cx="22" cy="19" r="4" fill="#18C46C"/>
        <text x="36" y="25">IvoryPay</text>
      </g>
    </g>
  </g>

  <!-- Right: settlement receipt -->
  <g transform="translate(748, 150)" filter="url(#soft)">
    <rect x="0" y="0" width="372" height="330" rx="14" fill="#16281F" stroke="#294036"/>
    <!-- head -->
    <circle cx="28" cy="34" r="5" fill="#18C46C"/>
    <text x="42" y="39" font-family="'Courier New', monospace" font-size="15" letter-spacing="2" fill="#93A79A">SETTLEMENT RECEIPT</text>
    <line x1="20" y1="58" x2="352" y2="58" stroke="#294036" stroke-dasharray="3 4"/>
    <!-- lines -->
    <g font-family="'Courier New', monospace" font-size="17">
      <text x="24" y="92" fill="#93A79A">amount</text>      <text x="348" y="92" text-anchor="end" fill="#EDE7D6">$100.00 USDC</text>
      <text x="24" y="126" fill="#93A79A">converted</text>   <text x="348" y="126" text-anchor="end" fill="#18C46C" font-weight="700">₦165,000.00</text>
      <text x="24" y="160" fill="#93A79A">recipient</text>   <text x="348" y="160" text-anchor="end" fill="#EDE7D6">•••• 4821 · Access</text>
      <text x="24" y="194" fill="#93A79A">prepare</text>     <text x="348" y="194" text-anchor="end" fill="#A99BFF">jwt signed · 5m</text>
      <line x1="20" y1="216" x2="352" y2="216" stroke="#294036" stroke-dasharray="3 4"/>
      <text x="24" y="250" fill="#93A79A">status</text>
    </g>
    <!-- seal -->
    <g transform="translate(232, 236) rotate(-11)">
      <circle cx="52" cy="30" r="44" fill="none" stroke="#18C46C" stroke-width="2.5"/>
      <circle cx="52" cy="30" r="37" fill="none" stroke="#18C46C" stroke-width="1" opacity="0.4"/>
      <text x="52" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#18C46C">SETTLED</text>
      <text x="52" y="44" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" fill="#0B7A41">NGN ✓</text>
    </g>
  </g>
</svg>
