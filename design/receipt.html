<title>GramPay Receipt</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --ground: #efeee8;
    --paper: #fcfbf8;
    --sunk: #f5f4ee;
    --ink: #1b1a16;
    --ink-2: #63625a;
    --ink-3: #94928a;
    --line: #eae8e0;
    --line-2: #dcdace;
    --card-border: transparent;
    --card-shadow: 0 1px 2px rgba(24, 22, 15, 0.05), 0 16px 34px -16px rgba(24, 22, 15, 0.22);

    --ok: #157b55;
    --ok-soft: #e4f0ea;
    --warn: #96660a;
    --warn-soft: #f3ead6;
    --bad: #a92a38;
    --bad-soft: #f3e0e2;

    --sel: #d9ede4;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --display: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #0d0d0a;
      --paper: #18170f;
      --sunk: #14130d;
      --ink: #f2f1e8;
      --ink-2: #a3a196;
      --ink-3: #6f6d62;
      --line: #262419;
      --line-2: #2f2d20;
      --card-border: #2b291d;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);

      --ok: #47c48d;
      --ok-soft: #16281f;
      --warn: #d7a340;
      --warn-soft: #2a2110;
      --bad: #e6707f;
      --bad-soft: #2a1418;

      --sel: #163a2b;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0d0d0a;
    --paper: #18170f;
    --sunk: #14130d;
    --ink: #f2f1e8;
    --ink-2: #a3a196;
    --ink-3: #6f6d62;
    --line: #262419;
    --line-2: #2f2d20;
    --card-border: #2b291d;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);

    --ok: #47c48d;
    --ok-soft: #16281f;
    --warn: #d7a340;
    --warn-soft: #2a2110;
    --bad: #e6707f;
    --bad-soft: #2a1418;

    --sel: #163a2b;
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--sel); color: var(--ink); }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--display);
    color: var(--ink);
    background: var(--ground);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 5vw, 56px) 20px 44px;
  }

  .app {
    width: 100%;
    max-width: 392px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- prototype controls (kept out of the receipt) ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    font-size: 12px;
    color: var(--ink-3);
  }
  .controls .grp { display: inline-flex; align-items: center; gap: 6px; }
  .controls .grp > span { letter-spacing: 0.02em; }
  .seg { display: inline-flex; gap: 2px; }
  .seg button,
  .theme-btn {
    font-family: var(--display);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    background: transparent;
    border: 0;
    border-radius: 7px;
    padding: 5px 9px;
    cursor: pointer;
    transition: color 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .seg button[aria-pressed="true"] { color: var(--ink); background: var(--sunk); }
  .spacer { flex: 1 1 auto; }
  .theme-btn {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    color: var(--ink-2);
  }
  .theme-btn svg { width: 16px; height: 16px; }
  @media (hover: hover) and (pointer: fine) {
    .seg button:hover,
    .theme-btn:hover { color: var(--ink); }
  }

  /* ---------- the receipt ---------- */
  .receipt {
    background: var(--paper);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 26px 24px 22px;
    animation: rise 460ms var(--ease-out) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; }
  .brand .mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
    padding-bottom: 1px;
  }
  .brand .wm {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .status .dot {
    display: inline-grid;
    place-items: center;
    width: 20px; height: 20px;
    border-radius: 50%;
  }
  .status .dot svg { width: 13px; height: 13px; }
  .status[data-s="ok"] .dot { background: var(--ok-soft); color: var(--ok); }
  .status[data-s="warn"] .dot { background: var(--warn-soft); color: var(--warn); }
  .status[data-s="bad"] .dot { background: var(--bad-soft); color: var(--bad); }

  .hero { margin-top: 26px; }
  .hero .cap {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 9px;
  }
  .hero .amount {
    font-weight: 700;
    font-size: clamp(38px, 11.5vw, 46px);
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .hero .amount .cur { color: var(--ink-2); font-weight: 600; margin-right: 2px; }
  .hero .amount.dim { color: var(--ink-2); }
  .hero .sub {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
  }

  .perf {
    margin: 22px -24px 4px;
    border-top: 1px dashed var(--line-2);
  }

  .ledger { margin: 0; padding: 6px 0 2px; }
  .ledger .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .ledger .row:last-child { border-bottom: 0; }
  .ledger dt {
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
    white-space: nowrap;
  }
  .ledger dd {
    margin: 0;
    text-align: right;
    font-size: 13.5px;
    color: var(--ink);
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .ledger dd.data {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .ledger dd .tag {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    margin-left: 7px;
  }
  .ledger .row.ref dd { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .copy {
    display: inline-grid;
    place-items: center;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    flex-shrink: 0;
    transition: color 140ms var(--ease-out);
  }
  .copy svg { width: 13px; height: 13px; }
  @media (hover: hover) and (pointer: fine) {
    .copy:hover { color: var(--ok); }
  }

  .foot {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .foot .powered { font-size: 12px; color: var(--ink-2); }
  .foot .powered b { color: var(--ink); font-weight: 600; }
  .foot .verify {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    text-decoration: none;
  }
  .foot .verify svg { width: 12px; height: 12px; color: var(--ok); }

  .swap { transition: opacity 180ms var(--ease-out), filter 180ms var(--ease-out); }
  .swap.out { opacity: 0; filter: blur(3px); }

  /* ---------- actions (app chrome, below the paper) ---------- */
  .actions { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 9px; }
  .act {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: var(--display);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 11px;
    border: 1px solid var(--line-2);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: transform 140ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out);
  }
  .act svg { width: 16px; height: 16px; }
  .act:active { transform: scale(0.97); }
  .act.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  @media (hover: hover) and (pointer: fine) {
    .act:hover { background: var(--sunk); }
    .act.primary:hover { background: var(--ink); filter: brightness(1.12); }
  }

  :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; border-radius: 4px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 14px);
    background: var(--ink);
    color: var(--paper);
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 15px;
    border-radius: 9px;
    box-shadow: var(--card-shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition: opacity 120ms linear !important; }
    .receipt { animation: none; }
    .swap.out { filter: none; }
  }
</style>

<div class="app">
  <div class="controls" role="group" aria-label="Prototype controls">
    <span class="grp">
      <span class="seg" id="kindSeg">
        <button data-kind="cashout" aria-pressed="true">Cash-out</button>
        <button data-kind="payment" aria-pressed="false">Payment</button>
      </span>
    </span>
    <span class="grp">
      <span class="seg" id="statusSeg">
        <button data-status="success" aria-pressed="true">Paid</button>
        <button data-status="pending" aria-pressed="false">Pending</button>
        <button data-status="failed" aria-pressed="false">Failed</button>
      </span>
    </span>
    <span class="spacer"></span>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle light or dark"></button>
  </div>

  <article class="receipt" id="receipt">
    <div class="top">
      <span class="brand">
        <span class="mark">g</span>
        <span class="wm">GramPay</span>
      </span>
      <span class="status" id="status" data-s="ok">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Successful</span>
      </span>
    </div>

    <div class="hero swap" id="heroBlock">
      <p class="cap" id="heroCap">Amount sent</p>
      <div class="amount" id="amount"><span class="cur">₦</span><span id="amountVal">165,000.00</span></div>
      <p class="sub" id="heroSub">100.00 USDC debited</p>
    </div>

    <div class="perf" aria-hidden="true"></div>

    <dl class="ledger swap" id="ledger"></dl>

    <div class="foot">
      <span class="powered">Settled via <b>IvoryPay</b></span>
      <a class="verify" id="verify" href="#" onclick="return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="verifyText">grampay.africa/r/cc27550c</span>
      </a>
    </div>
  </article>

  <div class="actions">
    <button class="act primary" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5M5 20h14"/></svg>
      Download
    </button>
    <button class="act" id="copyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15a3 3 0 010-4l3-3a3 3 0 014 4l-1 1"/><path d="M15 9a3 3 0 010 4l-3 3a3 3 0 01-4-4l1-1"/></svg>
      Copy link
    </button>
    <button class="act" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 12v7a1 1 0 001 1h10a1 1 0 001-1v-7"/></svg>
      Share
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>',
    bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M7 7l10 10"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
  };

  const DATA = {
    cashout: {
      cap: { success: "Amount sent", pending: "Amount pending", failed: "Amount (not sent)" },
      cur: "₦", val: "165,000.00",
      sub: "100.00 USDC debited",
      rows: [
        ["Recipient", "Adewale Okonkwo", "", false],
        ["Bank", "Access Bank", "", false],
        ["Account", "•• 6789", "", true],
        ["Rate", "1 USDC ≈ ₦1,650", "estimate", true],
        ["Date", "28 Aug 2026, 1:27 PM", "WAT", true],
      ],
      ref: "grampay_cc27550c",
      verify: "grampay.africa/r/cc27550c",
    },
    payment: {
      cap: { success: "Amount received", pending: "Awaiting payment", failed: "Payment failed" },
      cur: "₦", val: "50,000.00",
      sub: "≈ 30.30 USDC settled",
      rows: [
        ["From", "Chidinma Eze", "", false],
        ["Method", "GramPay checkout", "", false],
        ["Settles to", "USDC wallet", "", false],
        ["Rate", "1 USDC ≈ ₦1,650", "estimate", true],
        ["Date", "28 Aug 2026, 2:04 PM", "WAT", true],
      ],
      ref: "grampay_9f21ac77",
      verify: "grampay.africa/r/9f21ac77",
    },
  };

  const STATUS = {
    success: { label: "Successful", s: "ok" },
    pending: { label: "Pending", s: "warn" },
    failed: { label: "Failed", s: "bad" },
  };

  const $ = (id) => document.getElementById(id);
  let state = { kind: "cashout", status: "success" };

  function paint() {
    const d = DATA[state.kind];
    const st = STATUS[state.status];

    $("status").dataset.s = st.s;
    $("statusDot").innerHTML = ICONS[st.s];
    $("statusText").textContent = st.label;

    $("heroCap").textContent = d.cap[state.status];
    $("amount").querySelector(".cur").textContent = d.cur;
    $("amountVal").textContent = d.val;
    $("amount").classList.toggle("dim", state.status === "failed");
    $("heroSub").textContent = d.sub;

    const ledger = $("ledger");
    ledger.innerHTML = "";
    d.rows.forEach(([k, v, tag, mono]) => {
      const row = document.createElement("div");
      row.className = "row";
      const dt = document.createElement("dt");
      dt.textContent = k;
      const dd = document.createElement("dd");
      if (mono) dd.className = "data";
      dd.textContent = v;
      if (tag) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = tag;
        dd.appendChild(s);
      }
      row.append(dt, dd);
      ledger.appendChild(row);
    });

    const refRow = document.createElement("div");
    refRow.className = "row ref";
    const rdt = document.createElement("dt");
    rdt.textContent = "Reference";
    const rdd = document.createElement("dd");
    rdd.className = "data";
    const span = document.createElement("span");
    span.textContent = d.ref;
    const btn = document.createElement("button");
    btn.className = "copy";
    btn.setAttribute("aria-label", "Copy reference");
    btn.innerHTML = ICONS.copy;
    btn.onclick = () => copyText(d.ref, "Reference copied");
    rdd.append(span, btn);
    refRow.append(rdt, rdd);
    ledger.appendChild(refRow);

    $("verifyText").textContent = d.verify;
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function render(animate) {
    if (!animate || reduce) return paint();
    const blocks = [$("heroBlock"), $("ledger")];
    blocks.forEach((b) => b.classList.add("out"));
    setTimeout(() => {
      paint();
      requestAnimationFrame(() => blocks.forEach((b) => b.classList.remove("out")));
    }, 180);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove("show"), 1800);
  }
  async function copyText(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch { toast("Copy isn't available here"); }
  }

  $("kindSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.kind = b.dataset.kind;
    [...e.currentTarget.children].forEach((x) => x.setAttribute("aria-pressed", x === b));
    render(true);
  });
  $("statusSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.status = b.dataset.status;
    [...e.currentTarget.children].forEach((x) => x.setAttribute("aria-pressed", x === b));
    render(true);
  });

  function theme() {
    const t = document.documentElement.getAttribute("data-theme");
    return t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function syncTheme() { $("themeBtn").innerHTML = theme() === "dark" ? ICONS.sun : ICONS.moon; }
  $("themeBtn").addEventListener("click", () => {
    document.documentElement.setAttribute("data-theme", theme() === "dark" ? "light" : "dark");
    syncTheme();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);

  $("copyBtn").addEventListener("click", () => copyText("https://" + DATA[state.kind].verify, "Receipt link copied"));
  $("shareBtn").addEventListener("click", async () => {
    const url = "https://" + DATA[state.kind].verify;
    if (navigator.share) { try { await navigator.share({ title: "GramPay receipt", url }); } catch {} }
    else copyText(url, "Link copied to share");
  });
  $("downloadBtn").addEventListener("click", async () => {
    const node = $("receipt");
    toast("Rendering…");
    try {
      if (document.fonts) await document.fonts.ready;
      const bg = getComputedStyle(node).backgroundColor;
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: bg, logging: false });
      const a = document.createElement("a");
      a.download = "grampay-receipt-" + DATA[state.kind].ref.replace(/^grampay_/, "") + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
      toast("Saved as PNG");
    } catch { toast("Couldn't render the image here"); }
  });

  syncTheme();
  paint();
</script>
